<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EntreTiempo Psicología · Redes</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    font-family: 'DM Sans', sans-serif;
    background: linear-gradient(160deg, #0d2e42 0%, #0f3a52 50%, #1a5a6b 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px 60px;
    position: relative;
    overflow-x: hidden;
  }

  /* Decorative blobs */
  body::before {
    content: '';
    position: fixed; top: -120px; right: -120px;
    width: 380px; height: 380px; border-radius: 50%;
    background: rgba(91,168,168,0.10);
    pointer-events: none;
  }
  body::after {
    content: '';
    position: fixed; bottom: -100px; left: -100px;
    width: 300px; height: 300px; border-radius: 50%;
    background: rgba(91,168,168,0.07);
    pointer-events: none;
  }

  /* ── PROFILE ── */
  .profile {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 32px;
    position: relative; z-index: 1;
  }

  .team-photo-wrap {
    width: 220px; height: 220px;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,0.4), 0 0 0 3px rgba(91,168,168,0.3);
    margin-bottom: 18px;
  }
  .team-photo-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center top;
  }

  .profile-name {
    font-family: 'DM Sans', sans-serif;
    font-size: 20px; font-weight: 600;
    color: white; letter-spacing: 0.08em;
    margin-bottom: 3px;
  }
  .profile-sub {
    font-size: 12px; letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #7ec8c8;
    margin-bottom: 10px;
  }
  .profile-tagline {
    font-family: 'Cormorant Garamond', serif;
    font-size: 14px; font-style: italic;
    color: rgba(255,255,255,0.5);
    text-align: center;
    max-width: 260px;
    line-height: 1.6;
  }

  /* ── LINK BUTTONS ── */
  .links {
    display: flex; flex-direction: column; gap: 13px;
    width: 100%; max-width: 360px;
    position: relative; z-index: 1;
  }

  .link-btn {
    display: flex; align-items: center; gap: 14px;
    background: rgba(255,255,255,0.07);
    border: 1.5px solid rgba(255,255,255,0.14);
    border-radius: 14px;
    padding: 15px 20px;
    color: white; text-decoration: none;
    font-size: 15px; font-weight: 500;
    letter-spacing: 0.02em;
    transition: all .22s;
    cursor: pointer;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .link-btn:hover {
    background: rgba(255,255,255,0.13);
    border-color: rgba(126,200,200,0.6);
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(0,0,0,0.22);
  }

  .link-icon {
    width: 36px; height: 36px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .link-icon svg { width: 20px; height: 20px; fill: white; }

  .ig-grad { background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
  .tk-bg  { background: #010101; }
  .yt-bg  { background: #FF0000; }
  .fb-bg  { background: #1877F2; }
  .wa-bg  { background: #25D366; }
  .mail-bg{ background: #5ba8a8; }
  .web-bg  { background: white; overflow: hidden; }
  .cal-bg { background: linear-gradient(135deg, #1a73e8, #0d47a1); }

  .link-label { flex: 1; }
  .link-arrow { font-size: 20px; opacity: 0.4; font-weight: 300; }

  /* ── DIVIDER ── */
  .divider {
    width: 50px; height: 2px;
    background: linear-gradient(to right, transparent, #7ec8c8, transparent);
    margin: 32px 0 18px;
    position: relative; z-index: 1;
  }
  .footer-note {
    font-size: 12px; color: rgba(255,255,255,0.3);
    letter-spacing: 0.06em; text-align: center;
    position: relative; z-index: 1;
  }
</style>
</head>
